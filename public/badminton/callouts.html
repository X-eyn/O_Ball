<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callout Variants</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Four directions for Office Badminton's shot callouts (PERFECT, KILL, FIRE SHOT, MISHIT...), each
   playing the same rally over a stand-in court with the real pip scoreboard. A mockup only: nothing
   here is wired into the game. Space plays the next shot in all four; A toggles autoplay. */
:root { --navy: #13204a; --glass: rgba(16, 26, 62, .84); --cream: #fffaf0; --accent: #ffc83d; --red: #f0525c; --blue: #3d80f0; --dim: #8b93ad; --spring: cubic-bezier(.34, 1.56, .64, 1); }
* { box-sizing: border-box; }
html, body { margin: 0; background: #0b1024; color: #fff; font: 800 14px/1.3 Nunito, system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 9; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 18px; background: #0b1024; border-bottom: 1px solid #1d2647; }
header b { font: 600 18px Fredoka; margin-right: 6px; }
header button { font: 700 14px Fredoka; background: #1b2550; color: #fff; border: 2px solid #2d3a70; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
header button.on { background: var(--accent); color: #3b2600; border-color: var(--accent); }
header span { color: var(--dim); font-size: 13px; }
main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 620px), 1fr)); gap: 16px; padding: 16px; }
.cell { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 1px solid #1d2647;
  background:
    linear-gradient(180deg, transparent 38%, #0f5a4b 38%, #137257 100%),
    radial-gradient(circle, rgba(255,255,255,.08) 1.5px, transparent 2px) 0 0 / 14px 12px,
    linear-gradient(180deg, #0a0f22, #141c3a 40%); }
/* the court, in perspective */
.court { position: absolute; left: 50%; bottom: -4%; width: 70%; height: 66%; transform: translateX(-50%) perspective(500px) rotateX(38deg); transform-origin: 50% 100%; border: 3px solid rgba(255,255,255,.85); }
.court::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 3px solid rgba(255,255,255,.9); }
.court::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid rgba(255,255,255,.7); }
.pl { position: absolute; width: 22px; height: 44px; border-radius: 10px 10px 4px 4px; transform: translateX(-50%); box-shadow: 0 10px 8px -6px rgba(0,0,0,.5); }
.pl::before { content: ''; position: absolute; left: 50%; top: -15px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #e8b994; }
.p0 { left: 47%; bottom: 14%; width: 28px; height: 56px; background: var(--red); }
.p0::before { width: 20px; height: 20px; margin-left: -10px; top: -19px; }
.p1 { left: 53%; bottom: 56%; background: var(--blue); }
.cell .tag { position: absolute; left: 12px; bottom: 10px; font: 600 14px Fredoka; background: rgba(0,0,0,.5); padding: 4px 12px; border-radius: 999px; z-index: 5; }
.cell .tag i { font-style: normal; color: var(--accent); margin-right: 6px; }
/* the pip board (as in the game) */
.board { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 3px; padding: 7px 12px 8px; background: var(--glass); border: 2px solid rgba(255,255,255,.12); border-radius: 14px; z-index: 3; }
.row { position: relative; display: grid; grid-template-columns: 56px auto 22px; align-items: center; gap: 10px; height: 22px; }
.row .nm { font: 600 15px Fredoka; }
.row .pips { display: flex; gap: 4px; transition: opacity .2s, transform .25s; }
.row .pips i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.22); }
.row.r0 .pips i.on { background: var(--red); border-color: #ffb3b8; }
.row.r1 .pips i.on { background: var(--blue); border-color: #b3cfff; }
.row .pips i:last-child { border-style: dashed; border-color: rgba(255,200,61,.6); }
.row .num { font: 700 18px Fredoka; text-align: right; }

/* ============================================================ A · Board drawer */
/* the call slides out from under the board as a drawer of it: same glass, a colour edge for whose */
.A .drawer { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); width: calc(100% - 24px); height: 30px; overflow: hidden; z-index: -1; }
.A .slip { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(12, 20, 50, .9); border-radius: 0 0 12px 12px; border: 2px solid rgba(255,255,255,.1); border-top: 0; font: 600 13px Fredoka; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.85); transform: translateY(-100%); transition: transform .32s cubic-bezier(.2, .9, .25, 1); }
.A .slip.in { transform: translateY(0); }
.A .slip.gone { transform: translateY(-100%); transition-duration: .2s; }
.A .slip::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--pc); }
.A .slip b { font-weight: 700; color: var(--cc); }
.A .slip.big { font-size: 15px; letter-spacing: .1em; }
.A .slip.big b { text-shadow: 0 0 12px color-mix(in srgb, var(--cc) 70%, transparent); }
.A .slip small { font: 700 11px Nunito; letter-spacing: .04em; color: var(--dim); text-transform: none; }

/* ============================================================ B · Over the head */
/* no box: the word itself, lettered like the game's logo, over the player who made the shot */
.B .head { position: absolute; transform: translate(-50%, -100%); font: 700 22px Fredoka; color: var(--cc); white-space: nowrap; paint-order: stroke fill; -webkit-text-stroke: 5px var(--navy); text-shadow: 0 4px 0 var(--navy); animation: headPop 1.15s forwards; z-index: 4; pointer-events: none; letter-spacing: .01em; }
.B .head.small { font-size: 15px; -webkit-text-stroke: 4px var(--navy); text-shadow: 0 3px 0 var(--navy); color: #fff; opacity: .92; animation-duration: .95s; }
.B .head.big { font-size: 30px; }
.B .head.fire { font-size: 32px; animation: headPop 1.4s forwards, flick .12s steps(2) infinite; }
.B .head .sub { display: block; text-align: center; font-size: .5em; -webkit-text-stroke: 3px var(--navy); color: #fff; margin-top: -2px; }
@keyframes headPop { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.4); } 14% { opacity: 1; transform: translate(-50%, -100%) scale(1.12); } 24% { transform: translate(-50%, -100%) scale(1); } 75% { opacity: 1; transform: translate(-50%, -125%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(.96); } }
@keyframes flick { 50% { color: #ffd34d; } }
.B .burst { position: absolute; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--cc) 60%, transparent) 0, transparent 65%); animation: burst .5s ease-out forwards; z-index: 3; pointer-events: none; }
@keyframes burst { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

/* ============================================================ C · Combo rail */
/* fighting-game style: each player's calls stack on their own edge of the screen, slanted, with a
   streak count; the newest is big, the one before shrinks away */
.C .rail { position: absolute; top: 34%; display: flex; flex-direction: column; gap: 4px; z-index: 4; pointer-events: none; }
.C .rail.r0 { left: 14px; align-items: flex-start; }
.C .rail.r1 { right: 14px; align-items: flex-end; }
.C .hit { position: relative; font: 700 26px Fredoka; font-style: italic; color: var(--cc); transform: skewX(-10deg); paint-order: stroke fill; -webkit-text-stroke: 5px var(--navy); line-height: 1; animation: railIn .38s var(--spring); transition: opacity .3s, transform .3s, font-size .3s; white-space: nowrap; }
.C .rail.r1 .hit { text-align: right; }
.C .hit::after { content: ''; position: absolute; left: 0; right: 0; bottom: -5px; height: 4px; border-radius: 2px; background: var(--pc); transform-origin: left; animation: bar .5s .1s cubic-bezier(.2, .9, .25, 1) both; }
.C .rail.r1 .hit::after { transform-origin: right; }
.C .hit.old { font-size: 15px; opacity: .55; -webkit-text-stroke: 3px var(--navy); }
.C .hit.old::after { display: none; }
.C .hit.small { font-size: 17px; color: #fff; }
.C .hit .x { font-size: .62em; color: #fff; margin-left: 6px; }
.C .hit.out { opacity: 0; transform: skewX(-10deg) translateY(-8px); }
@keyframes railIn { from { opacity: 0; transform: skewX(-10deg) translateX(var(--from)) scale(1.3); } }
@keyframes bar { from { transform: scaleX(0); } }

/* ============================================================ D · Inside the row */
/* no new element at all: the call takes over that player's row of the board for a moment (the pips
   step aside, the word sweeps in in its colour), then the pips come back */
.D .row .call { position: absolute; left: 66px; right: 30px; top: 0; bottom: 0; display: flex; align-items: center; gap: 6px; font: 700 13px Fredoka; letter-spacing: .12em; text-transform: uppercase; color: var(--cc); white-space: nowrap; clip-path: inset(0 100% 0 0); transition: clip-path .28s cubic-bezier(.2, .9, .25, 1); }
.D .row.calling .call { clip-path: inset(0 0 0 0); }
.D .row.calling .pips { opacity: 0; transform: translateX(14px); }
.D .row .call.big { font-size: 14px; text-shadow: 0 0 10px color-mix(in srgb, var(--cc) 75%, transparent); }
.D .row .call small { font: 700 10px Nunito; letter-spacing: .04em; color: var(--dim); text-transform: none; }
.D .row.flash { animation: rowFlash .55s ease-out; }
@keyframes rowFlash { 0% { background: color-mix(in srgb, var(--cc) 30%, transparent); } 100% { background: transparent; } }
.D .row { border-radius: 8px; padding: 0 4px; margin: 0 -4px; }
</style>
</head>
<body>
<header>
  <b>Callout variants</b>
  <button id="next">Next shot <span style="opacity:.6">(Space)</span></button>
  <button id="auto" class="on">Autoplay <span style="opacity:.6">(A)</span></button>
  <button id="freeze">Freeze <span style="opacity:.6">(F)</span></button>
  <span id="now">—</span>
</header>
<main>
  <div class="cell A" data-v="A"><div class="tag"><i>A</i>Board drawer</div></div>
  <div class="cell B" data-v="B"><div class="tag"><i>B</i>Over the head</div></div>
  <div class="cell C" data-v="C"><div class="tag"><i>C</i>Combo rail</div></div>
  <div class="cell D" data-v="D"><div class="tag"><i>D</i>Inside the row</div></div>
</main>
<script>
// the rally every variant plays: who, the word, a detail, how big a moment it is, its colour
const SHOTS = [
  { p: 0, w: 'GREAT', d: 'late', k: 'small', c: '#9be86a' },
  { p: 1, w: 'DRIVE', k: 'small', c: '#ffffff' },
  { p: 0, w: 'PERFECT', d: 'smash', k: 'big', c: '#ffd34d' },
  { p: 1, w: 'COUNTER', k: 'mid', c: '#7fd8ff' },
  { p: 0, w: 'PERFECT', d: 'drive', k: 'big', c: '#ffd34d' },
  { p: 1, w: 'KILL', d: '284 km/h', k: 'big', c: '#ff5a5f' },
  { p: 0, w: 'MISHIT', k: 'small', c: '#ff9b9b' },
  { p: 1, w: 'FIRE SHOT', d: '402 km/h', k: 'fire', c: '#ff7a2a' },
  { p: 0, w: 'OVERPOWERED', k: 'mid', c: '#ff8a3d' },
  { p: 0, w: 'PERFECT', d: 'clear', k: 'big', c: '#ffd34d' },
];
const PC = ['var(--red)', 'var(--blue)'];
const score = [3, 4];
const cells = [...document.querySelectorAll('.cell')];
for (const cell of cells) {
  cell.insertAdjacentHTML('afterbegin', `<div class="court"></div><div class="pl p1"></div><div class="pl p0"></div>
    <div class="board">${[0, 1].map(i => `<div class="row r${i}"><span class="nm">${i ? 'Bot' : 'Zain'}</span><span class="pips">${Array.from({ length: 7 }, (_, k) => `<i class="${k < score[i] ? 'on' : ''}"></i>`).join('')}</span><span class="num">${score[i]}</span>${cell.dataset.v === 'D' ? '<span class="call"></span>' : ''}</div>`).join('')}
    ${cell.dataset.v === 'A' ? '<div class="drawer"></div>' : ''}</div>
    ${cell.dataset.v === 'C' ? '<div class="rail r0"></div><div class="rail r1"></div>' : ''}`);
}
// timers that a freeze holds back (so a frozen moment stays on screen)
let frozen = false; const held = [];
const later = (fn, ms) => setTimeout(() => frozen ? held.push(fn) : fn(), ms);
const label = s => s.d ? `${s.w} <small>${s.d}</small>` : s.w;

// A: the drawer under the board
const A = { show(cell, s) {
  const dr = cell.querySelector('.drawer');
  [...dr.children].forEach(o => { o.classList.add('gone'); later(() => o.remove(), 220); });
  const el = document.createElement('div');
  el.className = 'slip ' + (s.k === 'big' || s.k === 'fire' ? 'big' : '');
  el.style.setProperty('--pc', PC[s.p]); el.style.setProperty('--cc', s.k === 'small' ? '#fff' : s.c);
  el.innerHTML = `<b>${s.w}</b>${s.d ? `<small>${s.d}</small>` : ''}`;
  dr.appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  later(() => { if (el.isConnected) { el.classList.add('gone'); later(() => el.remove(), 220); } }, s.k === 'small' ? 1200 : 1700);
} };
// B: over the player's head
const B = { show(cell, s) {
  // (layout coordinates: the player's box is centred on its left edge by its own transform)
  const pl = cell.querySelector('.p' + s.p), x = pl.offsetLeft, y = pl.offsetTop - 22;
  const el = document.createElement('div');
  el.className = 'head ' + s.k; el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.setProperty('--cc', s.c);
  el.innerHTML = s.w + (s.d && s.k !== 'small' ? `<span class="sub">${s.d}</span>` : '');
  cell.appendChild(el); later(() => el.remove(), 1500);
  if (s.k === 'big' || s.k === 'fire') { const b = document.createElement('div'); b.className = 'burst'; b.style.left = x + 'px'; b.style.top = (y - 10) + 'px'; b.style.setProperty('--cc', s.c); cell.appendChild(b); later(() => b.remove(), 600); }
} };
// C: the combo rail on the player's edge
const streak = new Map();
const Cv = { show(cell, s) {
  const rail = cell.querySelector('.rail.r' + s.p);
  const key = cell.dataset.v + s.p, prev = streak.get(key) || { w: '', n: 0 };
  const n = prev.w === s.w ? prev.n + 1 : 1; streak.set(key, { w: s.w, n });
  [...rail.children].forEach((o, i) => { if (i === 0) o.classList.add('old'); else { o.classList.add('out'); later(() => o.remove(), 300); } });
  const el = document.createElement('div');
  el.className = 'hit ' + (s.k === 'small' ? 'small' : '');
  el.style.setProperty('--cc', s.c); el.style.setProperty('--pc', PC[s.p]); el.style.setProperty('--from', s.p ? '30px' : '-30px');
  el.innerHTML = s.w + (n > 1 ? `<span class="x">×${n}</span>` : '');
  rail.prepend(el);
  clearTimeout(rail._t); rail._t = later(() => [...rail.children].forEach(o => { o.classList.add('out'); later(() => o.remove(), 300); }), 2200);
} };
// D: the call takes over that player's row
const D = { show(cell, s) {
  const row = cell.querySelector('.row.r' + s.p), call = row.querySelector('.call');
  call.className = 'call ' + (s.k === 'big' || s.k === 'fire' ? 'big' : '');
  row.style.setProperty('--cc', s.k === 'small' ? '#fff' : s.c);
  call.innerHTML = label(s);
  row.classList.remove('flash'); void row.offsetWidth; if (s.k !== 'small') row.classList.add('flash');
  row.classList.add('calling');
  clearTimeout(row._t); row._t = later(() => row.classList.remove('calling'), s.k === 'small' ? 1000 : 1500);
} };

const V = { A, B, C: Cv, D };
let i = 0;
function next() {
  if (frozen) setFreeze(false);
  const s = SHOTS[i++ % SHOTS.length];
  document.getElementById('now').textContent = `${s.p ? 'Bot' : 'Zain'}: ${s.w}${s.d ? ' · ' + s.d : ''}`;
  for (const cell of cells) V[cell.dataset.v].show(cell, s);
}
let auto = true, timer = setInterval(() => auto && next(), 1500);
document.getElementById('next').onclick = next;
document.getElementById('auto').onclick = () => { auto = !auto; document.getElementById('auto').classList.toggle('on', auto); };
// freeze: everything holds where it is (the animations pause, nothing is taken away) until unfrozen
function setFreeze(on) {
  frozen = on; document.getElementById('freeze').classList.toggle('on', on);
  if (on) { auto = false; document.getElementById('auto').classList.remove('on'); document.getAnimations().forEach(a => a.pause()); }
  else { document.getAnimations().forEach(a => a.play()); held.splice(0).forEach(fn => fn()); }
}
document.getElementById('freeze').onclick = () => setFreeze(!frozen);
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') setFreeze(!frozen); });
addEventListener('keydown', e => { if (e.key === ' ') { next(); e.preventDefault(); } if (e.key.toLowerCase() === 'a') document.getElementById('auto').click(); });
next();
</script>
</body>
</html>
