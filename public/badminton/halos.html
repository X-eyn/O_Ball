<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halo Variants</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow:wght@600;700&family=Barlow+Condensed:wght@700;800;900&family=Fredoka:wght@600&family=Saira+Extra+Condensed:wght@600;700;800&family=Saira+Condensed:wght@500;600;700&family=Saira:wght@500;600&family=Archivo:ital,wdth,wght@0,62..125,500..900;1,62..125,500..900&family=Big+Shoulders+Display:wght@700;800;900&family=Big+Shoulders+Text:wght@600;700;800&family=JetBrains+Mono:wght@500;700&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
/* Four directions for the player card's halo (bottom left), each built on the current one: the round
   glass portrait, the forty-segment Fire charge ring, the ticks, the side column. A mockup only:
   nothing here is wired into the game. The portrait is the real recorded clip set (assets/halo-sheet.webp). */
:root { --red: #f0525c; --blue: #3d80f0; --accent: #ffc83d; --fire1: #ff4a10; --fire2: #ff9a2e; --fire3: #ffe9b0; --tk: 'Teko', 'Barlow Condensed', sans-serif; --lb: 'Barlow', system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #0b1024; color: #fff; font: 600 14px/1.3 var(--lb); }
header { position: sticky; top: 0; z-index: 9; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 18px; background: #0b1024; border-bottom: 1px solid #1d2647; }
header b { font: 600 18px Fredoka, sans-serif; margin-right: 10px; }
header button { font: 600 13px Fredoka, sans-serif; background: #1b2550; color: #fff; border: 2px solid #2d3a70; border-radius: 999px; padding: 5px 13px; cursor: pointer; }
header button.on { background: var(--accent); border-color: var(--accent); color: #2a1a00; }
header .sep { width: 1px; height: 22px; background: #2d3a70; margin: 0 6px; }
main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 600px), 1fr)); gap: 16px; padding: 16px; }
.cell { position: relative; height: calc(230px * var(--z, 1.5) + 60px); border-radius: 14px; overflow: hidden; border: 1px solid #1d2647;
  background:
    radial-gradient(ellipse 70% 60% at 70% 30%, rgba(255,255,255,.07), transparent 70%),
    linear-gradient(100deg, transparent 0 34%, rgba(255,255,255,.55) 34.2% 34.5%, transparent 34.7%),
    linear-gradient(180deg, #0c1530 0 18%, #136a55 18%, #1a8366 70%, #157559 100%); }
.cell .tag { position: absolute; left: 16px; top: 14px; font: 600 15px Fredoka, sans-serif; background: rgba(0,0,0,.5); padding: 5px 13px; border-radius: 999px; }
.cell .tag i { font-style: normal; color: var(--accent); margin-right: 6px; }
.cell .note { position: absolute; right: 16px; top: 14px; max-width: 46%; text-align: right; font-size: 12.5px; line-height: 1.4; color: rgba(255,255,255,.82); background: rgba(0,0,0,.42); padding: 7px 11px; border-radius: 10px; }
.stage { position: absolute; left: 20px; bottom: 18px; zoom: var(--z, 1.5); }

/* ================= shared: the card, the side column (type 1 · Pro, as in the game) ================= */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --spec { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.card { --pc: var(--red); --p: 0; position: relative; width: 340px; height: 180px; color: #fff; }
.card.blue { --pc: var(--blue); }
.halo { position: absolute; left: 0; bottom: 0; width: 150px; height: 150px; }
.halo > i, .halo > div, .halo > svg { position: absolute; }
.halo svg.frame { inset: 0; width: 100%; height: 100%; overflow: visible; }
.ticks line { stroke: rgba(255,255,255,.2); stroke-width: 1; stroke-linecap: round; transition: stroke .3s; }
.ticks line.major { stroke: rgba(255,255,255,.38); stroke-width: 1.6; }
.ticks line.lit { stroke: rgba(255,255,255,.9); }
.card.fire .ticks line.lit { stroke: #ffc27a; }
.pic { left: 21px; top: 21px; width: 108px; height: 108px; border-radius: 50%; overflow: hidden; background: #0a0f24; }
.pic canvas { position: absolute; left: -6px; top: -8px; width: 120px; height: 140px; filter: contrast(1.06) saturate(1.08); }
.glass { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(ellipse 70% 45% at 32% 12%, rgba(255,255,255,.22), transparent 70%), radial-gradient(circle, transparent 58%, rgba(4,7,20,.5) 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), inset 0 -16px 22px rgba(4,7,20,.45); }
.burst { inset: 4px; border-radius: 50%; border: 2px solid #ffc27a; opacity: 0; }
.burst.go { animation: burst .9s cubic-bezier(.16,.9,.3,1); }
@keyframes burst { from { opacity: 1; transform: scale(.92); } to { opacity: 0; transform: scale(1.7); border-width: .5px; } }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { opacity: .55; transform: scale(.96); } }

.side { position: absolute; left: 162px; bottom: 0; width: 176px; height: 180px; }
.side > * { position: absolute; left: 0; }
.grade { bottom: 122px; display: flex; flex-direction: column; gap: 4px; white-space: nowrap; transition: opacity 1.2s; }
.grade b { font: 700 31px/1 var(--tk); letter-spacing: .03em; color: var(--gc, #fff); text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.35); margin-bottom: -6px; }
.grade span { font: 600 9.5px/1 var(--lb); letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.76); text-shadow: 0 1px 4px rgba(0,0,0,.75); }
.grade.fresh b { animation: gIn .45s cubic-bezier(.16,.9,.3,1); }
.grade.settled { opacity: .45; }
@keyframes gIn { from { clip-path: inset(0 100% 0 0); transform: translateX(-8px); } to { clip-path: inset(0 -10% 0 0); } }
.id { bottom: 92px; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.id .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 8px var(--pc); }
.id b { font: 600 24px/1 var(--tk); letter-spacing: .05em; padding-top: 3px; text-shadow: 0 1px 2px rgba(0,0,0,.55), 0 0 18px rgba(0,0,0,.35); }
.streak { bottom: 74px; display: flex; align-items: center; gap: 5px; transition: opacity .3s; }
.streak[data-n="0"] { opacity: 0; }
.streak .pips { display: flex; gap: 4px; padding-left: 1px; }
.streak .pips i, .beads i { display: block; width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); box-shadow: 0 0 6px rgba(255,200,61,.75); animation: pipIn .4s cubic-bezier(.16,.9,.3,1); }
@keyframes pipIn { from { opacity: 0; transform: rotate(45deg) scale(.2); } }
.streak .n { font: 600 17px/1 var(--tk); color: var(--accent); letter-spacing: .04em; padding-top: 2px; }
.read { bottom: 14px; height: 52px; width: 176px; }
.read::before { content: ''; position: absolute; left: 0; top: -9px; width: 132px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.55), transparent); }
.read > div { position: absolute; left: 0; bottom: 0; display: flex; align-items: flex-end; transition: opacity .25s, transform .4s cubic-bezier(.16,.9,.3,1), filter .25s; }
.read .pct b { font: 700 58px/1 var(--tk); font-variant-numeric: tabular-nums; margin-bottom: -11px; text-shadow: 0 2px 3px rgba(0,0,0,.45), 0 0 22px rgba(0,0,0,.3); }
.read .pct > span, .read .ready > span { display: flex; flex-direction: column; margin: 0 0 4px 4px; gap: 2px; line-height: 1; }
.read .pct > span > i { font: 700 15px/1 var(--tk); font-style: normal; }
.read em { font: 600 8.5px/1 var(--lb); font-style: normal; letter-spacing: .32em; opacity: .58; }
.read .ready { opacity: 0; transform: translateX(-8px); filter: blur(3px); }
.read .ready kbd { font: 800 15px var(--lb); color: #12182f; background: linear-gradient(#fff, #e6e9f2); border-radius: 6px; padding: 3px 9px 4px; box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 16px rgba(255,140,40,.7); }
.read .ready b { font: 700 38px/1 var(--tk); color: #ffc27a; letter-spacing: .03em; margin-bottom: -7px; text-shadow: 0 0 14px rgba(255,110,30,.85), 0 2px 6px rgba(0,0,0,.5); }
.read .ready em { color: #ffd9a8; opacity: .85; }
.card.fire .read .pct { opacity: 0; transform: translateX(8px); filter: blur(3px); }
.card.fire .read .ready { opacity: 1; transform: none; filter: none; transition-delay: .12s; }

/* the standard segmented ring (B and D build on it) */
.ring { --r0: 60px; --r1: 63.5px; inset: 0; border-radius: 50%;
  -webkit-mask: radial-gradient(circle, transparent calc(var(--r0) - .5px), #000 var(--r0), #000 var(--r1), transparent calc(var(--r1) + .5px)), repeating-conic-gradient(#000 0 8.1deg, transparent 8.1deg 9deg);
  -webkit-mask-composite: source-in;
  mask: radial-gradient(circle, transparent calc(var(--r0) - .5px), #000 var(--r0), #000 var(--r1), transparent calc(var(--r1) + .5px)), repeating-conic-gradient(#000 0 8.1deg, transparent 8.1deg 9deg); mask-composite: intersect; }
.ring.track { background: rgba(255,255,255,.13); }
.ring.trail { background: conic-gradient(rgba(255,255,255,.18) 0deg, rgba(255,255,255,.98) calc(var(--p) * 360deg), transparent calc(var(--p) * 360deg)); filter: drop-shadow(0 0 3px rgba(255,255,255,.55)); transition: opacity .35s; }
.ring.flame { background: conic-gradient(var(--fire1), var(--fire2), var(--fire3), var(--fire2), var(--fire1), var(--fire2), var(--fire3), var(--fire2), var(--fire1)); opacity: 0; transition: opacity .45s; filter: drop-shadow(0 0 5px rgba(255,120,30,.9)); }
.head { inset: 0; transform: rotate(calc(var(--p) * 360deg)); opacity: clamp(0, calc(var(--p) * 30), 1); transition: opacity .3s; }
.head b { position: absolute; left: 50%; top: 13.25px; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px 2px rgba(255,255,255,.85), 0 0 16px 4px rgba(170,200,255,.55); }
.card.fire .ring.trail, .card.fire .head { opacity: 0; }
.card.fire .ring.flame { opacity: 1; animation: turn 4s linear infinite; }

/* =========================================================================================
   A · FORGED BEZEL: the ring becomes an object. A brushed-metal bezel with a slow specular sweep;
   the charge runs in a recessed groove cut into it, team colour at its tail to white-hot at the
   head; the head throws a horizontal lens streak; the ticks are engraved and light up. Every 10%
   a glint crosses the glass. Ready: the bezel goes molten and the glass takes the heat.
   ========================================================================================= */
.A .bezel { --r0: 55px; --r1: 74px; inset: 0; border-radius: 50%;
  background: conic-gradient(from var(--spec), #262c48, #9aa3c6 7%, #1c2240 18%, #59638c 34%, #141a32 48%, #b8c0e2 63%, #232a48 76%, #6c76a0 88%, #262c48);
  -webkit-mask: radial-gradient(circle, transparent 55px, #000 55.5px, #000 73.5px, transparent 74px); mask: radial-gradient(circle, transparent 55px, #000 55.5px, #000 73.5px, transparent 74px);
  animation: spec 14s linear infinite; filter: drop-shadow(0 6px 14px rgba(0,0,0,.6)); }
@keyframes spec { to { --spec: 360deg; } }
/* bevel edges: a bright lip outside, a dark lip inside */
.A .lip { inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35), 0 0 0 1px rgba(0,0,0,.5); }
.A .lip2 { inset: 19px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgba(0,0,0,.65), 0 0 0 2.5px rgba(255,255,255,.18); }
.A .groove { inset: 0; border-radius: 50%; background: radial-gradient(circle, transparent 58.5px, #050816 59px, #0b1028 63px, #02040c 66px, transparent 66.5px); }
.A .cells { --r0: 59.5px; --r1: 65.5px; background: conic-gradient(var(--pc) 0deg, color-mix(in srgb, var(--pc), #fff 55%) calc(var(--p) * 250deg), #fff calc(var(--p) * 360deg), transparent calc(var(--p) * 360deg)); filter: drop-shadow(0 0 4px color-mix(in srgb, var(--pc), #fff 40%)); transition: opacity .35s; }
.A .ticks line { stroke: rgba(0,0,0,.55); stroke-width: 1.2; }
.A .ticks line.major { stroke: rgba(0,0,0,.75); stroke-width: 2; }
.A .ticks line.lit { stroke: #fff; filter: drop-shadow(0 0 2px #fff); }
.A .head b { top: 12.5px; width: 10px; height: 10px; margin: -5px 0 0 -5px; box-shadow: 0 0 6px 2px #fff, 0 0 18px 6px color-mix(in srgb, var(--pc), #fff 50%); }
.A .head s { position: absolute; left: 50%; top: 12.5px; width: 0; height: 0; transform: rotate(calc(var(--p) * -360deg)); }
.A .head s::before { content: ''; position: absolute; left: -34px; top: -1px; width: 68px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(200,220,255,.9), #fff, rgba(200,220,255,.9), transparent); filter: blur(.4px); }
.A .molten { inset: 0; border-radius: 50%; opacity: 0; transition: opacity .6s; mix-blend-mode: color-dodge;
  background: conic-gradient(var(--fire1), var(--fire3), var(--fire2), var(--fire1), var(--fire3), var(--fire1));
  -webkit-mask: radial-gradient(circle, transparent 55px, #000 55.5px, #000 73.5px, transparent 74px); mask: radial-gradient(circle, transparent 55px, #000 55.5px, #000 73.5px, transparent 74px); }
.A .heat { inset: -16px; border-radius: 50%; background: radial-gradient(circle, rgba(255,120,30,.5), rgba(255,90,20,.15) 55%, transparent 70%); opacity: 0; transition: opacity .5s; }
.A .pic { left: 22px; top: 22px; width: 106px; height: 106px; }
.A .rim { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 7px -2px 12px -5px var(--pc), inset -3px 0 8px -4px rgba(170,200,255,.5); mix-blend-mode: screen; }
.A .glint { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
.A .glint::before { content: ''; position: absolute; top: -20%; left: -60%; width: 34%; height: 140%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: rotate(18deg) translateX(-40px); opacity: 0; }
.A .glint.go::before { animation: glint .7s cubic-bezier(.3,.6,.2,1); }
@keyframes glint { 0% { opacity: 1; transform: rotate(18deg) translateX(-40px); } 100% { opacity: 1; transform: rotate(18deg) translateX(230px); } }
.A.fire .cells, .A.fire .head { opacity: 0; }
.A.fire .molten { opacity: .85; animation: turn 3.2s linear infinite; }
.A.fire .heat { opacity: 1; animation: breathe 1.6s ease-in-out infinite; }
.A.fire .groove { background: radial-gradient(circle, transparent 58.5px, #3a0d00 59px, #ffb347 62px, #4a1200 66px, transparent 66.5px); }
.A.fire .glass { box-shadow: inset 0 0 0 1.5px rgba(255,180,100,.85), inset 0 -18px 26px rgba(255,90,20,.5); }
.A .id { gap: 0; }
.A .id .dot { width: 3px; height: 20px; border-radius: 2px; margin-right: 8px; }

/* =========================================================================================
   B · REACTOR: the charge fills the portrait too. Behind the ring's trail, light in your team
   colour rises inside the glass like liquid, its surface rolling, with a bright meniscus and
   bubbles; the athlete glows through it. Ready: it turns to fire, boils, and embers spill out
   over the top of the ring.
   ========================================================================================= */
.B .pic { box-shadow: 0 10px 24px rgba(0,0,0,.55), 0 0 0 1.5px rgba(255,255,255,.28); }
.B .liquid { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
.B .liquid i { position: absolute; left: -66px; width: 240px; height: 240px; border-radius: 41%; top: calc(108px - var(--p) * 84px - 6px); transition: top .5s cubic-bezier(.16,.9,.3,1); }
.B .liquid .w1 { background: linear-gradient(180deg, color-mix(in srgb, var(--pc), #fff 55%), color-mix(in srgb, var(--pc), #fff 10%) 18%, color-mix(in srgb, var(--pc), #000 30%) 45%); opacity: .78; mix-blend-mode: hard-light; box-shadow: inset 0 0 0 2.5px rgba(255,255,255,.95), inset 0 0 18px 6px rgba(255,255,255,.45); animation: turn 6s linear infinite; }
.B .liquid .w2 { background: color-mix(in srgb, var(--pc), #fff 40%); opacity: .35; mix-blend-mode: screen; border-radius: 44%; margin-top: -5px; animation: turn 9s linear infinite reverse; }
.B .bubbles { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--p) * 84px + 2px); overflow: hidden; transition: height .5s; }
.B .bubbles b { position: absolute; bottom: -6px; width: 4px; height: 4px; border-radius: 50%; border: 1px solid rgba(255,255,255,.7); animation: rise 2.6s linear infinite; }
@keyframes rise { to { transform: translateY(-96px); opacity: 0; } }
.B .core { inset: 18px; border-radius: 50%; box-shadow: 0 0 calc(var(--p) * 26px) calc(var(--p) * 4px) color-mix(in srgb, var(--pc), transparent 45%); }
.B .embers { left: 0; top: 0; width: 150px; height: 150px; pointer-events: none; opacity: 0; transition: opacity .4s; }
.B .embers b { position: absolute; left: var(--x); top: 22px; width: 3px; height: 3px; border-radius: 50%; background: #ffd27a; box-shadow: 0 0 6px 1px #ff8a2a; animation: ember 1.4s ease-out infinite; animation-delay: var(--d); }
@keyframes ember { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx), -46px) scale(.3); opacity: 0; } }
.B.fire .liquid .w1 { background: linear-gradient(180deg, #ffe9b0, var(--fire2) 18%, var(--fire1) 55%); box-shadow: inset 0 0 0 2px #fff3d0, inset 0 0 16px 5px rgba(255,220,150,.6); opacity: .55; animation-duration: 2.2s; }
.B.fire .liquid .w2 { background: var(--fire1); animation-duration: 3s; }
.B.fire .core { box-shadow: 0 0 30px 6px rgba(255,120,30,.6); }
.B.fire .embers { opacity: 1; }
.B.fire .glass { box-shadow: inset 0 0 0 1.5px rgba(255,180,100,.85), inset 0 -18px 26px rgba(255,90,20,.35); }

/* =========================================================================================
   C · OPEN GAUGE: the ring opens into a 270° gauge, like a rev counter: it climbs up the left,
   over the top and down the right, its segments thickening as it goes, team colour to white to
   gold. The charge number docks in the gap, where the arc ends, so ring and readout are one
   instrument. Ready: the segments chase with fire.
   ========================================================================================= */
.C svg.gauge { inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 3px rgba(255,255,255,.35)); }
.C .seg { fill: rgba(255,255,255,.12); transition: fill .25s; }
.C .seg.lit { fill: var(--c); }
.C .seg.hot { fill: #fff; }
.C.fire .seg { animation: chase .8s linear infinite; animation-delay: calc(var(--i) * -22ms); }
@keyframes chase { 0%, 100% { fill: var(--fire1); } 35% { fill: var(--fire3); } 65% { fill: var(--fire2); } }
.C.fire svg.gauge { filter: drop-shadow(0 0 5px rgba(255,120,30,.9)); }
.C .scale { font: 600 7.5px/1 var(--lb); letter-spacing: .14em; fill: rgba(255,255,255,.5); }
.C .chead { width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 3px rgba(255,255,255,.85), 0 0 22px 6px color-mix(in srgb, var(--pc), #fff 40%); transition: opacity .3s; }
.C.fire .chead { opacity: 0; }
.C .pic { left: 24px; top: 24px; width: 102px; height: 102px; box-shadow: 0 10px 24px rgba(0,0,0,.55), 0 0 0 1.5px rgba(255,255,255,.28), 0 0 0 5px rgba(5,8,22,.55); }
.C .glow { inset: -14px; border-radius: 50%; background: radial-gradient(circle, rgba(255,120,30,.55), rgba(255,90,20,.2) 50%, transparent 70%); opacity: 0; transition: opacity .5s; }
.C.fire .glow { opacity: 1; animation: breathe 1.6s ease-in-out infinite; }
.C .side { left: 156px; }
.C .grade { bottom: 132px; }
.C .id { bottom: 104px; }
.C .streak { bottom: 86px; }
.C .read { left: -18px; bottom: 2px; height: 70px; }
.C .read::before { display: none; }
.C .read .pct b { font-size: 76px; margin-bottom: -15px; }
.C .read .pct > span { margin-bottom: 8px; }
.C .read .ready { bottom: 12px; }
.C .end { width: 26px; height: 1.5px; left: 137px; top: 74px; background: linear-gradient(90deg, rgba(255,255,255,.55), transparent); transform-origin: 0 50%; transform: rotate(90deg); }

/* =========================================================================================
   D · BROADCAST PLATE: the medallion docks onto a slanted glass plate, so the text sits on a
   surface instead of floating over the court; a team stripe runs under it. Your perfect streak
   moves onto the halo, gold beads orbiting the top of the ring. Ready: a heat sweep crosses the
   plate.
   ========================================================================================= */
.D .plate { position: absolute; left: 74px; bottom: 16px; width: 262px; height: 104px; transform: skewX(-14deg); transform-origin: 0 100%; overflow: hidden; border-radius: 4px;
  background: linear-gradient(90deg, rgba(9,13,32,.9), rgba(9,13,32,.72) 62%, rgba(9,13,32,0)); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
.D .plate::before { content: ''; position: absolute; left: 0; bottom: 0; width: 82%; height: 3px; background: linear-gradient(90deg, var(--pc), transparent); }
.D .plate::after { content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,150,60,.35), transparent); opacity: 0; }
.D.fire .plate::after { opacity: 1; animation: sweep 1.8s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(0); } to { transform: translateX(500%); } }
.D.fire .plate::before { background: linear-gradient(90deg, var(--fire1), var(--fire2), transparent); }
.D .backing { inset: -6px; border-radius: 50%; background: radial-gradient(circle, rgba(9,13,32,.95) 66%, rgba(9,13,32,0) 72%); }
.D .pic { box-shadow: 0 0 0 1.5px rgba(255,255,255,.28); }
.D .beads { inset: 0; }
.D .beads i { position: absolute; left: 50%; top: 50%; margin: -3.5px; }
.D .glow { inset: -14px; border-radius: 50%; background: radial-gradient(circle, rgba(255,120,30,.55), rgba(255,90,20,.2) 50%, transparent 70%); opacity: 0; transition: opacity .5s; }
.D.fire .glow { opacity: 1; animation: breathe 1.6s ease-in-out infinite; }
.D .side { left: 168px; }
.D .grade { bottom: 128px; }
.D .id { bottom: 88px; }
.D .id .dot { display: none; }
.D .id small { font: 600 8.5px/1 var(--lb); letter-spacing: .32em; opacity: .55; margin-left: 4px; padding-top: 4px; }
.D .streak { display: none; }
.D .read { bottom: 26px; }
.D .read::before { top: -7px; }

.a5 .read .pct b { color: transparent; background: linear-gradient(180deg, #fff 0%, #fff 38%, #b9c4e4 62%, #e9eeff 100%); -webkit-background-clip: text; background-clip: text; text-shadow: none; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.32)) drop-shadow(0 0 10px rgba(0,0,0,.25)); padding: 0 4px 0 2px; }
.a5.redline .read .pct b { background-image: linear-gradient(180deg, #fff6dc 0%, #ffd890 40%, #ff9a3c 70%, #ffd18a 100%); filter: drop-shadow(2px 2px 0 rgba(90,30,0,.35)) drop-shadow(0 0 12px rgba(255,140,40,.45)); }
.a5 .grade b { color: transparent; background: linear-gradient(180deg, color-mix(in srgb, var(--gc), #fff 60%) 0%, var(--gc) 55%, color-mix(in srgb, var(--gc), #000 18%) 100%); -webkit-background-clip: text; background-clip: text; text-shadow: none; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.3)); padding-right: 4px; }
.a5 .read .ready b { color: transparent; background: linear-gradient(180deg, #fff3d6, #ffc27a 50%, #ff8a3a); -webkit-background-clip: text; background-clip: text; text-shadow: none; filter: drop-shadow(2px 2px 0 rgba(90,30,0,.4)) drop-shadow(0 0 10px rgba(255,110,30,.7)); padding-right: 4px; }

/* =========================================================================================
   Slab, refined: five takes. Shared by all five (.sx): every plate slants from its bottom-left
   corner, so stacked plates share one slanted left edge; the slab has a lit top edge; a new grade
   wipes the slab in along the slant with a white flash, the line under it following a beat later.
   ========================================================================================= */
.sx .grade b, .sx .grade > span, .sx .id { transform-origin: 0 100%; }
.sx .grade b { position: relative; background: linear-gradient(180deg, color-mix(in srgb, var(--gc), #fff 45%) 0 1.5px, var(--gc) 1.5px, color-mix(in srgb, var(--gc), #000 10%)); }
.sx .grade.fresh b { animation: slabIn .42s cubic-bezier(.2,.9,.25,1) both; }
.sx .grade.fresh b::after { content: ''; position: absolute; inset: 0; background: #fff; animation: slabFlash .55s ease-out both; }
.sx .grade.fresh > span { animation: stripIn .36s .1s cubic-bezier(.2,.9,.25,1) both; }
@keyframes slabIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(-10px -20px -20px -10px); } }
@keyframes stripIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(-10px -20px -20px -10px); } }
@keyframes slabFlash { 0%, 30% { opacity: .9; } 100% { opacity: 0; } }

/* 1 · Stacked plates: the speed drops onto its own dark plate under the slab; slab, speed and name share one slanted edge */
.s1 .grade { gap: 3px; left: 8px; bottom: 126px; }
.s1 .grade b { margin-left: 5px; }
.s1 .grade > span { align-self: flex-start; padding: 4px 9px 3px 7px; background: rgba(9,13,32,.84); transform: skewX(-14deg); box-shadow: 3px 3px 0 rgba(0,0,0,.25); font-stretch: 100%; color: rgba(255,255,255,.82); text-shadow: none; }
.s1 .id { left: 0; bottom: 96px; }
.s1 .streak { left: -4px; bottom: 77px; }

/* 2 · Plates everywhere: as 1, and the readout speaks the same language: the % tag turns into an amber slab in the redline; ready is a fire slab with FIRE knocked out */
.s2.redline .read .pct > span { padding: 3px 6px 2px 5px; background: #ffb347; color: #2a1200; transform: skewX(-14deg); transform-origin: 0 100%; box-shadow: 2px 2px 0 rgba(0,0,0,.3); }
.s2.redline .read .pct > span em { opacity: .8; color: #2a1200; }
.s2 .read .ready > span { gap: 4px; }
.s2 .read .ready b { font-style: normal; color: #1f0b00; padding: 4px 12px 2px 8px; background: linear-gradient(90deg, var(--fire1), var(--fire2) 55%, var(--fire3)); transform: skewX(-14deg); transform-origin: 0 100%; text-shadow: none; box-shadow: 3px 3px 0 rgba(0,0,0,.3), 0 0 18px rgba(255,110,30,.6); }

/* 3 · One-line slab: grade and speed on a single slab, the speed in a darker section of the grade's colour */
.s3 .grade { flex-direction: row; align-items: stretch; gap: 0; left: 6px; bottom: 130px; }
.s3 .grade b { box-shadow: none; padding-right: 10px; margin-left: 0; font-size: 22px; }
.s3 .grade > span { display: flex; align-items: center; padding: 1px 11px 0 9px; background: color-mix(in srgb, var(--gc), #0b1024 74%); transform: skewX(-14deg); color: #fff; font-size: 8.5px; font-stretch: 100%; letter-spacing: .16em; text-shadow: none; box-shadow: 3px 3px 0 rgba(0,0,0,.3); }
.s3 .grade > span .u { opacity: .7; }
.s3 .id { left: 0; bottom: 100px; }

/* 4 · Layered: the slab casts a team-colour plate behind it, speed lines trail it, the name tag inverts to white */
.s4 .grade b { box-shadow: 4px 4px 0 var(--pc), 7px 7px 0 rgba(0,0,0,.22); }
.s4 .grade b::before { content: ''; position: absolute; right: 100%; top: 4px; bottom: 4px; width: 20px; margin-right: 5px; background: repeating-linear-gradient(180deg, color-mix(in srgb, var(--gc), transparent 25%) 0 2px, transparent 2px 5.5px); -webkit-mask: linear-gradient(90deg, transparent, #000); mask: linear-gradient(90deg, transparent, #000); }
.s4 .id { background: #fff; }
.s4 .id b { color: #0b1024; }

/* 5 · Earned fill: only a PERFECT fills the slab (and glows); anything less is the slab's outline in its colour */
.s5 .grade b { transition: none; }
.s5 .grade:not(.top) b { background: rgba(9,13,32,.6); color: var(--gc); box-shadow: inset 0 0 0 2px var(--gc), 3px 3px 0 rgba(0,0,0,.25); }
.s5 .grade.top b { box-shadow: 3px 3px 0 rgba(0,0,0,.3), 0 0 18px color-mix(in srgb, var(--gc), transparent 45%); }

/* ---- gauge renderers on canvas (.cv): drawn each frame at 3x, with bloom, light decay and motion ---- */
.gcv { position: absolute; left: -20px; top: -20px; width: 190px; height: 190px; pointer-events: none; }
.cv svg.gauge, .cv .needle { display: none; }

<body>
<header>
  <b>Halo · final</b>
  <button data-m="loop" class="on">Loop</button><button data-m="mid">Hold 45%</button><button data-m="red">Hold 92%</button><button data-m="fire">Hold ready</button>
  <span class="sep"></span>
  <button data-z="1">1×</button><button data-z="1.5" class="on">1.5×</button><button data-z="2">2×</button>
  <span class="sep"></span>
  <button id="team">Team: red</button>
</header>
<main>
  <section class="cell"><span class="tag"><i>Final</i>C+ · d1 Stacked plates · F4 Liquid + warm</span><span class="note">The picked combination: the 270° open gauge, Broadcast Black in stacked slanted plates, and the F4 smooth fill (soft liquid edge, flowing sheen, fresh charge glowing warm and cooling).</span><div class="stage"><div class="card C C2 ty ty2 ax a4 sx s1 cv" data-v="C2" data-g="f4"></div></div></section>
</main>
<script>
const NS = 'http://www.w3.org/2000/svg';
const SIDE = `<div class="side">
  <div class="grade"><b></b><span></span></div>
  <div class="id"><i class="dot"></i><b>ZAN</b></div>
  <div class="streak" data-n="0"><span class="pips"></span><b class="n"></b></div>
  <div class="read"><div class="pct"><b class="v">0</b><span><i>%</i><em>FIRE</em></span></div><div class="ready"><kbd>A</kbd><span><b data-w="FIRE">FIRE</b><em>READY</em></span></div></div>
</div>`;
const PIC = extra => `<div class="pic"><canvas width="168" height="196"></canvas>${extra}<i class="glass"></i></div>`;
const STD = `<svg class="frame" viewBox="0 0 150 150"><g class="ticks"></g></svg><i class="ring track"></i><i class="ring trail"></i><i class="ring flame"></i><i class="head"><b></b></i>`;
const HALO = {
  A: `<i class="heat"></i><i class="bezel"></i><i class="molten"></i><i class="lip"></i><i class="lip2"></i><i class="groove"></i><i class="ring cells"></i><svg class="frame" viewBox="0 0 150 150"><g class="ticks"></g></svg><i class="head"><b></b><s></s></i>${PIC('<i class="rim"></i><i class="glint"></i>')}<i class="burst"></i>`,
  B: `<i class="core"></i>${STD}${PIC('<div class="liquid"><i class="w2"></i><i class="w1"></i></div><div class="bubbles"></div>')}<i class="embers"></i><i class="burst"></i>`,
  C: `<i class="glow"></i><svg class="gauge" viewBox="0 0 150 150"><g class="segs"></g><text class="scale" x="64" y="146">0</text><text class="scale" x="143" y="86">100</text></svg>${PIC('')}<i class="chead"></i><i class="burst"></i>`,
  C2: `<i class="glow"></i><svg class="gauge" viewBox="0 0 150 150"><g class="scale2"></g><g class="segs"></g></svg>${PIC('')}<i class="needle"><b></b></i><i class="burst"></i>`,
  D: `<i class="glow"></i><i class="backing"></i>${STD}${PIC('')}<i class="beads"></i><i class="burst"></i>`,
};

const sheet = new Image(); sheet.src = 'assets/halo-sheet.webp';
const FW = 168, FH = 196, COLS = 12, FPS = 20, CLIP = { idle: [0, 40], pump: [40, 46], flourish: [86, 46] };

const cards = [...document.querySelectorAll('.card')].map(el => {
  const v = el.dataset.v;
  el.innerHTML = (v === 'D' ? '<div class="plate"></div>' : '') + `<div class="halo">${HALO[v]}</div>` + SIDE;
  if (v === 'D') el.querySelector('.id').insertAdjacentHTML('beforeend', '<small>P1</small>');
  const c = { el, v, ctx: el.querySelector('canvas').getContext('2d'), grade: el.querySelector('.grade'), pctEl: el.querySelector('.pct .v'), streakEl: el.querySelector('.streak'), lastFrame: -1, lit: -1, ticks: [], segs: [], burst: el.querySelector('.burst') };
  // ticks: forty round the ring, every tenth a major
  const tg = el.querySelector('.ticks');
  if (tg) for (let i = 0; i < 40; i++) {
    const a = i / 40 * Math.PI * 2 - Math.PI / 2, major = i % 10 === 0, r0 = v === 'A' ? (major ? 66.5 : 68) : (major ? 66.5 : 67.5), r1 = v === 'A' ? 72 : 71;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 75 + Math.cos(a) * r0); l.setAttribute('y1', 75 + Math.sin(a) * r0); l.setAttribute('x2', 75 + Math.cos(a) * r1); l.setAttribute('y2', 75 + Math.sin(a) * r1);
    if (major) l.setAttribute('class', 'major'); tg.appendChild(l); c.ticks.push(l);
  }
  // C: 36 tapering segments over 270°, from the bottom, up the left, over the top, down to the right
  if (v === 'C' || v === 'C2') {
    const g = el.querySelector('.segs'), P = (r, d) => { const a = d * Math.PI / 180; return `${(75 + Math.cos(a) * r).toFixed(2)} ${(75 + Math.sin(a) * r).toFixed(2)}`; };
    const sector = (a0, a1, rI, rO) => `M${P(rO, a0)} A${rO} ${rO} 0 0 1 ${P(rO, a1)} L${P(rI, a1)} A${rI} ${rI} 0 0 0 ${P(rI, a0)}Z`;
    for (let i = 0; i < 36; i++) {
      const a0 = 90 + i * 7.5 + .6, a1 = a0 + 6.3, rI = 58, rO = 61 + 6.5 * (i / 35);
      const s = document.createElementNS(NS, 'path');
      s.setAttribute('d', sector(a0, a1, rI, rO));

const readPc = () => cards.forEach(c => { c.pc = hex(getComputedStyle(c.el).getPropertyValue('--pc')); });
readPc();

let charge = 0, readyAt = 0, lastNow = performance.now(), hitQ = 1;
function tick(now) {
  const dt = Math.min(.05, (now - lastNow) / 1000); lastNow = now;
  let target, ready;
  if (now - lastHit > 1200) {
    lastHit = now; n++;
    const k = kinds[n % kinds.length], kmh = 120 + (n * 37) % 220, perfect = n % 7 !== 6;
    streak = perfect ? streak + 1 : 0; hitQ = perfect ? 1 : .55;
    if (streak > 0 && streak % 3 === 0) play = { name: 'pump', t0: now };
    cards.forEach(c => { perfect ? setGrade(c, 'PERFECT', '#ffd34d', `${k} · ${kmh} km/h`) : setGrade(c, 'GREAT', '#9be86a', `late · ${kmh} km/h`); drawStreak(c); });
    if (mode === 'loop' && !readyAt) charge = Math.min(1, charge + (perfect ? .1 + (n % 3) * .03 : .05));
  }
  if (mode === 'loop') {
    if (charge >= 1 && !readyAt) readyAt = now;
    if (readyAt && now - readyAt > 3500) { charge = 0; readyAt = 0; }
    target = charge; ready = charge >= 1;
  } else if (mode === 'mid') { target = .45; ready = false; } else if (mode === 'red') { target = .92; ready = false; } else { target = 1; ready = true; }
  if (ready && !wasReady) { play = { name: 'flourish', t0: now }; cards.forEach(c => { c.burst.classList.remove('go'); void c.burst.offsetWidth; c.burst.classList.add('go'); }); }
  wasReady = ready;
  // the portrait frame: idle back and forth, a celebration once through
  let [s, len] = CLIP[play.name], i = Math.floor((now - play.t0) / 1000 * FPS);
  if (play.name !== 'idle' && i >= len) { play = { name: 'idle', t0: now }; [s, len] = CLIP.idle; i = 0; }
  if (play.name === 'idle') { const m = i % (2 * len - 2); i = m < len ? m : 2 * len - 2 - m; }
  const f = s + Math.min(len - 1, i), time = now / 1000;
  cards.forEach(c => {
    // the display follows the charge on a spring
    if (target > c.lastTarget + 1e-4) {
      const g = { from: c.gate ? c.goal : cl(c.pv), to: target, t0: now, q: hitQ, streak, delay: c.feed ? 240 : 0 };
      g.dur = 260 + 360 * target; g.land = g.t0 + g.delay + g.dur + (c.el.dataset.g === 'p3' ? Math.min(2, Math.floor(streak / 3)) * 110 : 0);
      c.gains.push(g);
    } else if (target < c.lastTarget - 1e-4) { c.gains = []; c.goal = target; }
    c.lastTarget = target; if (c.gains.length > 6) c.gains.shift();
    // gated gauges move only when a packet lands
    if (c.gate) { for (const g of c.gains) if (now >= g.land && g.to > c.goal) c.goal = g.to; } else c.goal = target;
    const K = c.gate ? 320 : 140, D = c.gate ? 30 : 19; // (gated: snap to the landing, a little overshoot)
    c.vel += ((c.goal - c.pv) * K - c.vel * D) * dt; c.pv += c.vel * dt;
    if (c.flow) { c.vel = 0; const was = c.pv0 || 0; c.m1 = sdamp(c.m1, c.goal, c.s1, dt); c.pv = sdamp(c.pv0 ?? 0, c.m1, c.s2, dt); c.pv0 = c.pv; c.spd = lerp(c.spd || 0, Math.max(0, (c.pv - was) / Math.max(dt, 1e-3)), .25); }
    const p = cl(c.pv), v = Math.floor(p * 100 + 1e-6);
    c.el.style.setProperty('--p', p.toFixed(4));
    c.el.classList.toggle('fire', ready);
    c.el.classList.toggle('redline', p >= RED && !ready);
    if (v !== c.lastV) { c.lastV = v; c.pctEl.textContent = v; c.pctEl.dataset.w = v; }
    if (sheet.complete && sheet.naturalWidth && f !== c.lastFrame) { c.lastFrame = f; c.ctx.clearRect(0, 0, FW, FH); c.ctx.drawImage(sheet, (f % COLS) * FW, Math.floor(f / COLS) * FH, FW, FH, 0, 0, FW, FH); }
    if (c.gx) { const g = c.gx; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 190 * GS, 190 * GS); g.setTransform(GS, 0, 0, GS, 0, 0); c.gfn(c, g, { p, ready, time, now, dt }); return; }
    if (c.v === 'C2') { // the SVG gauge (the current one)
      const ls = Math.floor(p * 36 + 1e-6);
      c.ticks.forEach((t, k) => t.classList.toggle('lit', k <= ls && p > 0));
      c.lbls.forEach(t => t.classList.toggle('lit', +t.dataset.i <= ls));
      c.segs.forEach((sg, k) => { sg.classList.toggle('lit', k < ls); sg.classList.toggle('hot', k < ls && k >= ls - 2 && !ready); });
    }
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; t0 = performance.now(); charge = 0; readyAt = 0; document.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b)); });
document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { document.documentElement.style.setProperty('--z', b.dataset.z); document.querySelectorAll('[data-z]').forEach(x => x.classList.toggle('on', x === b)); });
document.getElementById('team').onclick = e => { const blue = !cards[0].el.classList.contains('blue'); cards.forEach(c => c.el.classList.toggle('blue', blue)); e.target.textContent = 'Team: ' + (blue ? 'blue' : 'red'); readPc(); };
</script>
