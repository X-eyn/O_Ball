<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office Ball Demo</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#e8ecf5;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
  canvas{width:min(100vw, calc((100vh - 56px) * 1100 / 680));height:auto;display:block}
  #help{font-size:13px;opacity:.85;margin-top:8px;text-align:center;line-height:1.7}
  kbd{background:#1e2640;border:1px solid #33406a;border-radius:4px;padding:1px 6px;font-size:12px;font-family:inherit}
  .r{color:#ff6b7a;font-weight:600}.b{color:#5bb5ff;font-weight:600}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1100" height="680"></canvas>
  <div id="help">
    <span class="r">RED</span> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · hold/release <kbd>Space</kbd> kick · <kbd>L-Shift</kbd> dash
    &nbsp;&nbsp;|&nbsp;&nbsp;
    <span class="b">BLUE</span> <kbd>Arrows</kbd> move · hold/release <kbd>Enter</kbd> kick · <kbd>R-Shift</kbd> dash
    &nbsp;&nbsp;|&nbsp;&nbsp; <kbd>B</kbd> toggle bot · <kbd>Esc</kbd> menu
  </div>
</div>
<script>
// ---------- constants ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1100, H = 680;
const FL = 70, FR = 1030, FT = 92, FB = 652, CX = (FL + FR) / 2, CY = (FT + FB) / 2;
const GH = 170, GY1 = CY - GH / 2, GY2 = CY + GH / 2, GD = 42, POST_R = 6;
const POSTS = [[FL, GY1], [FL, GY2], [FR, GY1], [FR, GY2]];
const PR = 18, BR = 10;
const ACC = 0.5, FRIC = 0.89, BFRIC = 0.988, WALL_E = 0.75;
const CHARGE_FULL = 40, PERF_END = 52, REACH = PR + BR + 9;
const DASH_CD = 100, DASH_T = 11, DASH_SPEED = 12.5;
const MATCH_TIME = 120 * 60, WIN_GOALS = 3;

// ---------- input ----------
const keys = {}, pressed = {};
const BLOCK = ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','ShiftLeft','ShiftRight','Slash','Numpad0','NumpadEnter'];
addEventListener('keydown', e => { if (!keys[e.code]) pressed[e.code] = true; keys[e.code] = true; if (BLOCK.includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const CONTROLS = [
  { up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'], kick:['Space'], dash:['ShiftLeft'] },
  { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'], kick:['Enter','NumpadEnter','Numpad0'], dash:['ShiftRight','Slash','ControlRight'] },
];
const any = (arr, m) => arr.some(k => m[k]);

// ---------- state ----------
let state = 'title', botMode = false;
let players, ball, score, time, suddenDeath, snaps, particles, floats, banner;
let shake = 0, hitstop = 0, stateT = 0, kickoffT = 0, goalIdx = 0, rI = 0, rEnd = 0, winner = -1, lastScorer = -1;
const series = [0, 0];

function mkPlayer(i) {
  return { i, x:0, y:0, vx:0, vy:0, fx: i ? -1 : 1, fy: 0, ch:false, ct:0, dashT:0, dashCd:0, dashHit:false, recover:0, stun:0,
    color: i ? '#3fa7ff' : '#ff4d5e', name: i ? 'BLUE' : 'RED', bot:{hold:0},
    st:{ goals:0, shots:0, perfect:0, tackles:0, poss:0 } };
}
function resetMatch() {
  players = [mkPlayer(0), mkPlayer(1)];
  ball = { x:CX, y:CY, vx:0, vy:0, spin:0, hot:0, last:-1 };
  score = [0, 0]; time = MATCH_TIME; suddenDeath = false; snaps = []; particles = []; floats = []; banner = null; winner = -1;
  startKickoff();
}
function startKickoff() {
  const [a, b] = players;
  Object.assign(a, { x: FL + 190, y: CY, vx:0, vy:0, ch:false, ct:0, stun:0, dashT:0, recover:0, fx:1, fy:0 });
  Object.assign(b, { x: FR - 190, y: CY, vx:0, vy:0, ch:false, ct:0, stun:0, dashT:0, recover:0, fx:-1, fy:0 });
  Object.assign(ball, { x:CX, y:CY, vx:0, vy:0, spin:0, hot:0 });
  state = 'kickoff'; kickoffT = 55;
}

// ---------- fx helpers ----------
function float(x, y, text, color, size = 18) { floats.push({ x, y, text, color, size, t: 60 }); }
function burst(x, y, color, n, sp) { for (let k = 0; k < n; k++) { const a = Math.random() * 6.283, s = Math.random() * sp; particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 30 + Math.random() * 20, color }); } }
function setBanner(text, sub, color, t = 90) { banner = { text, sub, color, t, max: t }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- bot ----------
function botInput(p) {
  const o = players[0], inp = { u:0, d:0, l:0, r:0, kick:false, dashP:false };
  const gx = FL - 8, gy = CY + (Math.sin(performance.now() / 900) * 50); // aims around the goal
  let ux = gx - ball.x, uy = gy - ball.y; const ug = Math.hypot(ux, uy) || 1; ux /= ug; uy /= ug;
  const bd = Math.hypot(ball.x - p.x, ball.y - p.y), od = Math.hypot(ball.x - o.x, ball.y - o.y);
  const side = (p.x - ball.x) * -ux + (p.y - ball.y) * -uy; // >0 => behind ball
  let tx, ty;
  if (od < bd - 30 && ball.x > CX - 150) { // defend
    tx = ball.x + (FR - ball.x) * 0.45; ty = ball.y + (CY - ball.y) * 0.45;
  } else if (side < PR) { // go around the ball
    const px = -uy, py = ux, s = ((p.x - ball.x) * px + (p.y - ball.y) * py) > 0 ? 1 : -1;
    tx = ball.x - ux * 40 + px * s * 48; ty = ball.y - uy * 40 + py * s * 48;
  } else { tx = ball.x - ux * (PR + BR - 2); ty = ball.y - uy * (PR + BR - 2); }
  const mx = tx - p.x, my = ty - p.y;
  if (mx > 5) inp.r = 1; if (mx < -5) inp.l = 1; if (my > 5) inp.d = 1; if (my < -5) inp.u = 1;
  const aligned = side > 0 && ((ball.x - p.x) * ux + (ball.y - p.y) * uy) / Math.max(bd, 1) > 0.8;
  if (p.bot.hold > 0) { inp.kick = true; p.bot.hold--; if (bd > REACH + 40) p.bot.hold = 0; }
  else if (aligned && bd < REACH + 20 && Math.random() < 0.12) {
    const dg = Math.hypot(gx - ball.x, gy - ball.y);
    p.bot.hold = dg < 420 ? CHARGE_FULL + ((Math.random() * 18) | 0) : 6 + ((Math.random() * 18) | 0);
    inp.kick = true;
  }
  const pd = Math.hypot(o.x - p.x, o.y - p.y);
  if (od < REACH + 6 && pd < 110 && p.dashCd === 0 && Math.random() < 0.04) {
    inp.l = inp.r = inp.u = inp.d = 0;
    if (o.x - p.x > 8) inp.r = 1; if (o.x - p.x < -8) inp.l = 1; if (o.y - p.y > 8) inp.d = 1; if (o.y - p.y < -8) inp.u = 1;
    inp.dashP = true;
  }
  return inp;
}
function humanInput(i) {
  const c = CONTROLS[i];
  return { u: +any(c.up, keys), d: +any(c.down, keys), l: +any(c.left, keys), r: +any(c.right, keys), kick: any(c.kick, keys), dashP: any(c.dash, pressed) };
}

// ---------- kicking ----------
function tryKick(p, ct) {
  const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
  if (d > REACH) { if (ct > 14) float(p.x, p.y - 32, 'whiff', '#9aa3b8', 14); return; }
  const nx = dx / d, ny = dy / d;
  let power, perfect = false;
  if (ct >= CHARGE_FULL && ct <= PERF_END) { power = 1.3; perfect = true; }
  else if (ct > PERF_END) power = 0.85;
  else power = 0.3 + 0.7 * ct / CHARGE_FULL;
  const sp = 5 + 12 * power;
  ball.vx = nx * sp; ball.vy = ny * sp;
  const lat = p.vx * -ny + p.vy * nx; // sideways movement => curve
  ball.spin = clamp(lat * 0.0034, -0.017, 0.017) * (power > 0.6 ? 1 : 0.5);
  ball.hot = perfect ? 80 : 0; ball.last = p.i;
  p.vx -= nx * 1.2; p.vy -= ny * 1.2;
  if (power > 0.6) p.st.shots++;
  if (perfect) {
    p.st.perfect++; hitstop = 5; shake = 9;
    float(p.x, p.y - 36, 'PERFECT!', '#ffd34d', 22); burst(ball.x, ball.y, '#ffd34d', 26, 6);
  } else {
    shake = Math.max(shake, power * 4); burst(ball.x, ball.y, '#ffffff', 8, 3);
    if (Math.abs(ball.spin) > 0.01) float(p.x, p.y - 32, 'curve', '#b8f0ff', 13);
  }
}

// ---------- physics ----------
function stepPlayer(p, inp) {
  if (p.dashCd > 0) p.dashCd--;
  if (p.recover > 0) p.recover--;
  // kick charge / release
  if (p.stun > 0) { p.ch = false; p.ct = 0; }
  else if (inp.kick) { if (!p.ch) { p.ch = true; p.ct = 0; } p.ct++; }
  else if (p.ch) { p.ch = false; tryKick(p, p.ct); p.ct = 0; }
  // movement
  let ax = inp.r - inp.l, ay = inp.d - inp.u; const m = Math.hypot(ax, ay);
  if (m) { ax /= m; ay /= m; p.fx = ax; p.fy = ay; }
  if (p.stun > 0) { p.stun--; ax = ay = 0; }
  // dash
  if (inp.dashP && p.dashCd === 0 && p.stun === 0) {
    const dx = m ? ax : p.fx, dy = m ? ay : p.fy;
    p.vx = dx * DASH_SPEED; p.vy = dy * DASH_SPEED; p.dashT = DASH_T; p.dashCd = DASH_CD; p.dashHit = false;
    burst(p.x, p.y, p.color, 10, 2.5);
  }
  if (p.dashT > 0) {
    p.dashT--; p.vx *= 0.97; p.vy *= 0.97;
    if (Math.random() < 0.7) particles.push({ x: p.x, y: p.y, vx: 0, vy: 0, t: 14, color: p.color });
    if (p.dashT === 0 && !p.dashHit) { p.recover = 30; float(p.x, p.y - 30, 'missed', '#9aa3b8', 13); }
  } else {
    const a = ACC * (p.ch ? 0.62 : 1) * (p.recover > 0 ? 0.35 : 1);
    p.vx = (p.vx + ax * a) * FRIC; p.vy = (p.vy + ay * a) * FRIC;
  }
  p.x += p.vx; p.y += p.vy;
  if (p.x < FL + PR) { p.x = FL + PR; p.vx = 0; } if (p.x > FR - PR) { p.x = FR - PR; p.vx = 0; }
  if (p.y < FT + PR) { p.y = FT + PR; p.vy = 0; } if (p.y > FB - PR) { p.y = FB - PR; p.vy = 0; }
}

function collidePlayers() {
  const [a, b] = players;
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = PR * 2;
  if (d >= min || d === 0) return;
  const nx = dx / d, ny = dy / d, ov = (min - d) / 2;
  a.x -= nx * ov; a.y -= ny * ov; b.x += nx * ov; b.y += ny * ov;
  const aDash = a.dashT > 0 && !a.dashHit, bDash = b.dashT > 0 && !b.dashHit;
  if (aDash !== bDash) {
    const atk = aDash ? a : b, vic = aDash ? b : a, s = aDash ? 1 : -1;
    atk.dashHit = true; vic.stun = 50; vic.ch = false; vic.ct = 0;
    vic.vx = nx * s * 8; vic.vy = ny * s * 8; atk.vx *= 0.3; atk.vy *= 0.3;
    atk.st.tackles++; shake = 7; hitstop = 3;
    float(vic.x, vic.y - 34, 'TACKLED!', '#ff9f43', 18); burst(vic.x, vic.y, '#ff9f43', 16, 4);
    return;
  }
  const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
  if (rel < 0) { const j = -(1.3) * rel / 2; a.vx -= j * nx; a.vy -= j * ny; b.vx += j * nx; b.vy += j * ny; }
}

function collideBall(p) {
  const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy), min = PR + BR;
  if (d >= min || d === 0) return;
  const nx = dx / d, ny = dy / d, ov = min - d;
  ball.x += nx * ov * 0.85; ball.y += ny * ov * 0.85; p.x -= nx * ov * 0.15; p.y -= ny * ov * 0.15;
  const rel = (ball.vx - p.vx) * nx + (ball.vy - p.vy) * ny;
  if (rel < 0) {
    const mb = 0.5, mp = 1, j = -(1 + 0.5) * rel / (1 / mb + 1 / mp);
    ball.vx += j / mb * nx; ball.vy += j / mb * ny; p.vx -= j / mp * nx; p.vy -= j / mp * ny;
    ball.spin *= 0.5; ball.last = p.i;
  }
  if (p.dashT > 0 && !p.dashHit) { p.dashHit = true; shake = 3; } // poking the ball counts as a successful dash
}

function stepBall() {
  const b = ball;
  if (b.spin) {
    const c = Math.cos(b.spin), s = Math.sin(b.spin), vx = b.vx * c - b.vy * s;
    b.vy = b.vx * s + b.vy * c; b.vx = vx; b.spin *= 0.985;
    if (Math.abs(b.spin) < 0.0005) b.spin = 0;
  }
  b.x += b.vx; b.y += b.vy; b.vx *= BFRIC; b.vy *= BFRIC;
  if (b.hot > 0) b.hot--;
  if (b.x < FL || b.x > FR) { // inside a goal
    if (b.y < GY1 + BR) { b.y = GY1 + BR; b.vy = Math.abs(b.vy) * 0.3; }
    if (b.y > GY2 - BR) { b.y = GY2 - BR; b.vy = -Math.abs(b.vy) * 0.3; }
    if (b.x < FL - GD + BR) { b.x = FL - GD + BR; b.vx = Math.abs(b.vx) * 0.2; }
    if (b.x > FR + GD - BR) { b.x = FR + GD - BR; b.vx = -Math.abs(b.vx) * 0.2; }
    b.vx *= 0.95; b.vy *= 0.95; b.spin = 0;
  } else {
    const sp = Math.hypot(b.vx, b.vy);
    if (b.y < FT + BR) { b.y = FT + BR; b.vy = Math.abs(b.vy) * WALL_E; b.spin *= 0.3; if (sp > 8) shake = Math.max(shake, 2); }
    if (b.y > FB - BR) { b.y = FB - BR; b.vy = -Math.abs(b.vy) * WALL_E; b.spin *= 0.3; if (sp > 8) shake = Math.max(shake, 2); }
    if (!(b.y > GY1 && b.y < GY2)) {
      if (b.x < FL + BR) { b.x = FL + BR; b.vx = Math.abs(b.vx) * WALL_E; b.spin *= 0.3; }
      if (b.x > FR - BR) { b.x = FR - BR; b.vx = -Math.abs(b.vx) * WALL_E; b.spin *= 0.3; }
    }
  }
  for (const [px, py] of POSTS) {
    const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy), min = BR + POST_R;
    if (d < min && d > 0) {
      const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
      b.x = px + nx * min; b.y = py + ny * min;
      if (vn < 0) {
        b.vx -= (1 + WALL_E) * vn * nx; b.vy -= (1 + WALL_E) * vn * ny; b.spin = 0;
        if (-vn > 7 && state === 'play') { shake = 8; float(px, py - 20, 'POST!', '#ffffff', 20); burst(px, py, '#ffffff', 12, 4); }
      }
    }
  }
}

function snapshot() {
  snaps.push({ bx: ball.x, by: ball.y, hot: ball.hot, p: players.map(p => ({ x: p.x, y: p.y, stun: p.stun, ch: p.ch, ct: p.ct, dashT: p.dashT, color: p.color, name: p.name, fx: p.fx, fy: p.fy, i: p.i })) });
}

function goal(scorer) {
  score[scorer]++; players[scorer].st.goals++; lastScorer = scorer;
  const own = ball.last !== -1 && ball.last !== scorer;
  const p = players[scorer];
  setBanner(own ? 'OWN GOAL!' : 'GOAL!', own ? `${players[1 - scorer].name} scored for ${p.name}` : `${p.name}  ${score[0]} – ${score[1]}`, p.color, 80);
  shake = 16; hitstop = 6;
  burst(ball.x, ball.y, p.color, 60, 8); burst(ball.x, ball.y, '#ffffff', 30, 6);
  goalIdx = snaps.length - 1;
  if (score[scorer] >= WIN_GOALS || suddenDeath) winner = scorer;
  state = 'goal'; stateT = 80;
}

function endMatch(w) {
  winner = w; series[w]++; state = 'over'; stateT = 0;
  burst(CX, CY, players[w].color, 80, 9);
}

// ---------- main step ----------
function step() {
  // global keys
  if (pressed.KeyB && (state === 'title' || state === 'over')) botMode = !botMode;
  if (pressed.Escape) { state = 'title'; }

  if (state === 'title') {
    if (pressed.Space || pressed.Enter) resetMatch();
  } else if (state === 'over') {
    stateT++;
    if (stateT > 40 && (pressed.KeyR || pressed.Space || pressed.Enter)) resetMatch();
  } else if (state === 'replay') {
    rI += 0.42;
    if (rI >= rEnd || (rI > goalIdx - 100 && (pressed.Space || pressed.Enter))) {
      if (winner >= 0) endMatch(winner); else startKickoff();
    }
  } else if (hitstop > 0) {
    hitstop--;
  } else {
    if (state === 'kickoff') { kickoffT--; if (kickoffT <= 0) state = 'play'; }
    const live = state === 'play' || state === 'goal';
    if (live) {
      const inputs = [humanInput(0), botMode ? botInput(players[1]) : humanInput(1)];
      players.forEach((p, k) => stepPlayer(p, inputs[k]));
      collidePlayers();
      players.forEach(collideBall);
      stepBall();
      // possession
      const d0 = Math.hypot(ball.x - players[0].x, ball.y - players[0].y), d1 = Math.hypot(ball.x - players[1].x, ball.y - players[1].y);
      if (Math.min(d0, d1) < 70 && state === 'play') players[d0 < d1 ? 0 : 1].st.poss++;
    }
    if (state === 'play') {
      if (ball.x < FL - BR) goal(1);
      else if (ball.x > FR + BR) goal(0);
      else if (!suddenDeath) {
        time--;
        if (time <= 0) {
          time = 0;
          if (score[0] !== score[1]) endMatch(score[0] > score[1] ? 0 : 1);
          else { suddenDeath = true; setBanner('SUDDEN DEATH', 'next goal wins', '#ff5d5d', 110); shake = 10; }
        }
      }
    } else if (state === 'goal') {
      stateT--;
      if (stateT <= 0) { state = 'replay'; rI = Math.max(0, goalIdx - 150); rEnd = Math.min(snaps.length - 1, goalIdx + 30); }
    }
    if (state === 'play') { snapshot(); if (snaps.length > 400) snaps.splice(0, snaps.length - 400); }
    else if (state === 'goal') snapshot();
  }

  // fx
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.92; pt.vy *= 0.92; pt.t--; }
  particles = particles.filter(p => p.t > 0);
  for (const f of floats) { f.y -= 0.6; f.t--; }
  floats = floats.filter(f => f.t > 0);
  if (banner && --banner.t <= 0) banner = null;
  shake *= 0.86;
  for (const k in pressed) delete pressed[k];
}

// ---------- drawing ----------
function drawPitch() {
  ctx.fillStyle = '#153d25'; ctx.fillRect(0, 0, W, H);
  const bands = 12, bw = (FR - FL) / bands;
  for (let k = 0; k < bands; k++) { ctx.fillStyle = k % 2 ? '#2b8049' : '#2f8a4f'; ctx.fillRect(FL + k * bw, FT, bw + 1, FB - FT); }
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3;
  ctx.strokeRect(FL, FT, FR - FL, FB - FT);
  ctx.beginPath(); ctx.moveTo(CX, FT); ctx.lineTo(CX, FB); ctx.stroke();
  ctx.beginPath(); ctx.arc(CX, CY, 80, 0, 6.283); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(CX, CY, 4, 0, 6.283); ctx.fill();
  ctx.lineWidth = 2.5;
  ctx.strokeRect(FL, CY - 150, 110, 300); ctx.strokeRect(FR - 110, CY - 150, 110, 300);
  // goals
  for (const [gx, dir, col] of [[FL, -1, '#ff4d5e'], [FR, 1, '#3fa7ff']]) {
    const x0 = dir < 0 ? gx - GD : gx;
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x0, GY1, GD, GH);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
    for (let yy = GY1; yy <= GY2; yy += 10) { ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x0 + GD, yy); ctx.stroke(); }
    for (let xx = x0; xx <= x0 + GD; xx += 10) { ctx.beginPath(); ctx.moveTo(xx, GY1); ctx.lineTo(xx, GY2); ctx.stroke(); }
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(gx, GY1); ctx.lineTo(x0 + (dir < 0 ? 0 : GD), GY1); ctx.lineTo(x0 + (dir < 0 ? 0 : GD), GY2); ctx.lineTo(gx, GY2); ctx.stroke();
  }
  for (const [px, py] of POSTS) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, POST_R, 0, 6.283); ctx.fill(); }
}

function drawPlayer(p, live) {
  const stunned = p.stun > 0;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(p.x + 3, p.y + 5, PR, PR * 0.8, 0, 0, 6.283); ctx.fill();
  if (p.ch) { ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p.x, p.y, REACH, 0, 6.283); ctx.stroke(); }
  ctx.fillStyle = stunned ? '#6b7385' : p.color;
  if (p.dashT > 0) { ctx.shadowColor = p.color; ctx.shadowBlur = 20; }
  ctx.beginPath(); ctx.arc(p.x, p.y, PR, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  // facing nub
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x + p.fx * (PR - 5), p.y + p.fy * (PR - 5), 3.5, 0, 6.283); ctx.fill();
  // charge ring
  if (p.ch) {
    const f = Math.min(p.ct / CHARGE_FULL, 1), perfect = p.ct >= CHARGE_FULL && p.ct <= PERF_END, over = p.ct > PERF_END;
    ctx.lineWidth = perfect ? 6 : 4;
    ctx.strokeStyle = perfect ? '#ffd34d' : over ? '#8a8fa0' : '#ffffff';
    if (perfect) { ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 18; }
    ctx.beginPath(); ctx.arc(p.x, p.y, PR + 7, -Math.PI / 2, -Math.PI / 2 + f * 6.283); ctx.stroke(); ctx.shadowBlur = 0;
  }
  // dash cooldown
  if (live && p.dashCd > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, PR + 3, Math.PI * 0.25, Math.PI * 0.25 + (1 - p.dashCd / DASH_CD) * Math.PI * 0.5); ctx.stroke();
  }
  if (stunned) {
    const t = performance.now() / 120;
    for (let k = 0; k < 3; k++) { const a = t + k * 2.09; ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(p.x + Math.cos(a) * 16, p.y - 24 + Math.sin(a) * 5, 3, 0, 6.283); ctx.fill(); }
  }
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '600 11px Segoe UI'; ctx.textAlign = 'center';
  ctx.fillText(p.i === 1 && botMode ? 'BOT' : p.name, p.x, p.y + PR + 15);
}

function drawBall(x, y, hot, trail) {
  for (let k = 0; k < trail.length; k++) {
    const t = trail[k], a = (k + 1) / trail.length;
    ctx.fillStyle = hot > 0 ? `rgba(255,211,77,${a * 0.6})` : `rgba(255,255,255,${a * 0.25})`;
    ctx.beginPath(); ctx.arc(t[0], t[1], BR * a * (hot > 0 ? 1.1 : 0.8), 0, 6.283); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x + 2, y + 4, BR, BR * 0.8, 0, 0, 6.283); ctx.fill();
  if (hot > 0) { ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 20; }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, BR, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.stroke();
}

function fmtTime(f) { const s = Math.ceil(f / 60); return `${(s / 60) | 0}:${String(s % 60).padStart(2, '0')}`; }

function drawHUD() {
  ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, W, 72);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '800 44px Segoe UI';
  ctx.fillStyle = '#ff4d5e'; ctx.fillText(score[0], CX - 110, 38);
  ctx.fillStyle = '#3fa7ff'; ctx.fillText(score[1], CX + 110, 38);
  ctx.font = '700 15px Segoe UI';
  ctx.fillStyle = '#ff4d5e'; ctx.fillText('RED', CX - 190, 38);
  ctx.fillStyle = '#3fa7ff'; ctx.fillText(botMode ? 'BOT' : 'BLUE', CX + 190, 38);
  if (suddenDeath) {
    const blink = (performance.now() / 300 | 0) % 2;
    ctx.fillStyle = blink ? '#ff5d5d' : '#ffb3b3'; ctx.font = '800 18px Segoe UI'; ctx.fillText('SUDDEN DEATH', CX, 38);
  } else {
    ctx.fillStyle = time < 600 ? '#ff8a8a' : '#e8ecf5'; ctx.font = '700 30px Segoe UI'; ctx.fillText(fmtTime(time), CX, 38);
  }
  ctx.font = '600 12px Segoe UI'; ctx.fillStyle = '#8b94ad'; ctx.textAlign = 'left';
  ctx.fillText(`First to ${WIN_GOALS} · 2 min`, 16, 30);
  ctx.fillText(`Series  RED ${series[0]} – ${series[1]} ${botMode ? 'BOT' : 'BLUE'}`, 16, 50);
  ctx.textAlign = 'right';
  ctx.fillText('Hold kick → release in the GOLD window', W - 16, 30);
  ctx.fillText('Move sideways while kicking = curve', W - 16, 50);
  ctx.textBaseline = 'alphabetic';
}

function overlay(alpha = 0.72) { ctx.fillStyle = `rgba(8,12,26,${alpha})`; ctx.fillRect(0, 0, W, H); }

function drawTitle() {
  drawPitch(); overlay(0.8);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff'; ctx.font = '900 72px Segoe UI'; ctx.fillText('OFFICE BALL', CX, 190);
  ctx.fillStyle = '#8b94ad'; ctx.font = '600 16px Segoe UI'; ctx.fillText('vision demo · 1v1 · first to 3 · sudden death', CX, 222);
  const lines = [
    ['KICK', 'Hold to charge, release when the ring turns GOLD for a PERFECT shot. Hold too long = weak.'],
    ['CURVE', 'Move sideways while you release, and the ball bends. Bank it off the walls.'],
    ['DASH', 'Slam into the opponent to stun them and steal the ball. Miss it and you are sluggish for a moment.'],
  ];
  ctx.font = '15px Segoe UI';
  lines.forEach(([h, t], k) => {
    const y = 300 + k * 50;
    ctx.textAlign = 'right'; ctx.fillStyle = '#ffd34d'; ctx.font = '800 16px Segoe UI'; ctx.fillText(h, CX - 330, y);
    ctx.textAlign = 'left'; ctx.fillStyle = '#dfe4f0'; ctx.font = '15px Segoe UI'; ctx.fillText(t, CX - 310, y);
  });
  ctx.textAlign = 'center';
  ctx.fillStyle = botMode ? '#5bb5ff' : '#ff6b7a'; ctx.font = '700 20px Segoe UI';
  ctx.fillText(botMode ? 'Mode: YOU (red) vs BOT' : 'Mode: 2 players, 1 keyboard', CX, 490);
  ctx.fillStyle = '#8b94ad'; ctx.font = '14px Segoe UI'; ctx.fillText('press B to switch', CX, 514);
  const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 250);
  ctx.fillStyle = `rgba(255,255,255,${pulse})`; ctx.font = '800 26px Segoe UI'; ctx.fillText('PRESS SPACE TO PLAY', CX, 580);
}

function drawOver() {
  overlay(0.78);
  const w = players[winner];
  ctx.textAlign = 'center';
  ctx.fillStyle = w.color; ctx.font = '900 64px Segoe UI'; ctx.fillText(`${w.i === 1 && botMode ? 'BOT' : w.name} WINS`, CX, 170);
  ctx.fillStyle = '#fff'; ctx.font = '800 36px Segoe UI'; ctx.fillText(`${score[0]} – ${score[1]}`, CX, 220);
  const tot = Math.max(1, players[0].st.poss + players[1].st.poss);
  const rows = [
    ['Goals', p => p.st.goals], ['Shots', p => p.st.shots], ['PERFECT kicks', p => p.st.perfect],
    ['Tackles won', p => p.st.tackles], ['Possession', p => Math.round(p.st.poss / tot * 100) + '%'],
  ];
  ctx.font = '600 17px Segoe UI';
  rows.forEach(([label, f], k) => {
    const y = 290 + k * 36;
    ctx.fillStyle = '#ff6b7a'; ctx.textAlign = 'right'; ctx.fillText(f(players[0]), CX - 120, y);
    ctx.fillStyle = '#8b94ad'; ctx.textAlign = 'center'; ctx.fillText(label, CX, y);
    ctx.fillStyle = '#5bb5ff'; ctx.textAlign = 'left'; ctx.fillText(f(players[1]), CX + 120, y);
  });
  ctx.textAlign = 'center'; ctx.fillStyle = '#dfe4f0'; ctx.font = '600 18px Segoe UI';
  ctx.fillText(`Series: RED ${series[0]} – ${series[1]} ${botMode ? 'BOT' : 'BLUE'}`, CX, 490);
  if (stateT > 40) {
    const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 200);
    ctx.fillStyle = `rgba(255,211,77,${pulse})`; ctx.font = '900 30px Segoe UI'; ctx.fillText('RUN IT BACK?  [SPACE]', CX, 570);
    ctx.fillStyle = '#8b94ad'; ctx.font = '14px Segoe UI'; ctx.fillText('B = toggle bot · Esc = menu', CX, 600);
  }
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'title') { drawTitle(); return; }
  const sx = (Math.random() - 0.5) * shake * 2, sy = (Math.random() - 0.5) * shake * 2;
  ctx.setTransform(1, 0, 0, 1, sx, sy);
  drawPitch();

  if (state === 'replay') {
    const i0 = Math.floor(rI), i1 = Math.min(i0 + 1, snaps.length - 1), t = rI - i0, A = snaps[i0], B = snaps[i1];
    const L = (a, b) => a + (b - a) * t;
    const trail = []; for (let k = Math.max(0, i0 - 12); k < i0; k++) trail.push([snaps[k].bx, snaps[k].by]);
    A.p.forEach((pa, k) => drawPlayer({ ...pa, x: L(pa.x, B.p[k].x), y: L(pa.y, B.p[k].y) }, false));
    drawBall(L(A.bx, B.bx), L(A.by, B.by), A.hot, trail);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 72, W, H - 72);
    const blink = (performance.now() / 400 | 0) % 2;
    ctx.fillStyle = blink ? '#ff3b3b' : 'rgba(255,59,59,.3)'; ctx.beginPath(); ctx.arc(FL + 20, FT + 24, 7, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 20px Segoe UI'; ctx.textAlign = 'left'; ctx.fillText('REPLAY', FL + 34, FT + 31);
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '13px Segoe UI'; ctx.textAlign = 'right'; ctx.fillText('Space to skip', FR - 14, FT + 29);
    drawHUD(); return;
  }

  const trail = []; for (let k = Math.max(0, snaps.length - 12); k < snaps.length; k++) trail.push([snaps[k].bx, snaps[k].by]);
  for (const pt of particles) { ctx.globalAlpha = Math.min(1, pt.t / 30); ctx.fillStyle = pt.color; ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  if (state === 'over') { drawBall(ball.x, ball.y, 0, []); players.forEach(p => drawPlayer(p, false)); }
  else { players.forEach(p => drawPlayer(p, true)); drawBall(ball.x, ball.y, ball.hot, state === 'kickoff' ? [] : trail); }
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.t / 20); ctx.fillStyle = f.color; ctx.font = `800 ${f.size}px Segoe UI`; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawHUD();

  if (state === 'kickoff') {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = '900 40px Segoe UI';
    ctx.fillText(kickoffT > 15 ? 'READY' : 'GO!', CX, CY - 110);
  }
  if (banner) {
    const k = banner.t / banner.max, sc = 1 + Math.max(0, (k - 0.85)) * 3;
    ctx.save(); ctx.translate(CX, CY - 20); ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.fillStyle = banner.color; ctx.shadowColor = banner.color; ctx.shadowBlur = 30;
    ctx.font = '900 84px Segoe UI'; ctx.fillText(banner.text, 0, 0); ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '700 22px Segoe UI'; ctx.fillText(banner.sub, 0, 40);
    ctx.restore();
  }
  if (state === 'over') drawOver();
}

// ---------- loop ----------
let acc = 0, last = performance.now();
function frame(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(frame);
}
resetMatch(); state = 'title';
requestAnimationFrame(frame);
</script>
</body>
</html>
